<section class="admin-dashboard">
  <header>
    <h2>Admin console</h2>
    <p>Manage routes, stations, users, and system activity at a glance.</p>
  </header>

  <div class="admin-dashboard__stats">
    <article *ngFor="let stat of stats">
      <span class="value">{{ stat.value }}</span>
      <span class="label">{{ stat.label }}</span>
    </article>
  </div>

  <section class="admin-dashboard__actions">
    <button type="button">Manage users</button>
    <button type="button">Configure routes</button>
    <button type="button">Assign buses</button>
  </section>
</section>
