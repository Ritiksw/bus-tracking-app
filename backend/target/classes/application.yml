spring:
  application:
    name: bus-tracking-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_tracking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env

security:
  jwt:
    secret: QnVzVHJhY2tpbmdBcHBTZWNyZXRLZXlEMTIzNDU2Nzg5MA==
    access-token-ttl-minutes: 60

bootstrap:
  admin:
    username: admin
    password: Admin123!
    role: ADMIN

